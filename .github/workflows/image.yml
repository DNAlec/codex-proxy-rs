name: Commit image
run-name: Commit image ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA reachable from the selected workflow branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: github.repository != 'zyycn/codex-proxy-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      image: ${{ steps.metadata.outputs.image }}
      matrix: ${{ steps.metadata.outputs.matrix }}
      build_time: ${{ steps.metadata.outputs.build_time }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve fixed source and image namespace
        id: metadata
        env:
          SOURCE_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse "$SOURCE_SHA^{commit}")" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git checkout --detach "$SOURCE_SHA"
          {
            echo "sha=$SOURCE_SHA"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ruby -rjson -ryaml -e 'puts "matrix=#{JSON.generate({include: YAML.load_file("release/platforms.yaml").fetch("platforms").select { |p| p["docker"] == true }})}"'
          } >> "$GITHUB_OUTPUT"
          {
            echo "Source commit: $SOURCE_SHA"
            echo "Workflow commit: $GITHUB_SHA"
            echo "Image: ghcr.io/${GITHUB_REPOSITORY,,}:sha-$SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    needs: source
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  build:
    name: Build and verify (${{ matrix.dockerPlatform }})
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout fixed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to fork GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先上传候选 digest，质量和运行验收全部通过后才发布提交标签
      - name: Build candidate image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: ${{ matrix.dockerPlatform }}
          outputs: type=image,name=${{ needs.source.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CPR_GIT_SHA=${{ needs.source.outputs.sha }}
            CPR_BUILD_TIME=${{ needs.source.outputs.build_time }}
            CPR_BUILD_TYPE=source
          labels: |
            org.opencontainers.image.title=Codex Proxy RS
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          no-cache-filters: |
            runtime-base
            runtime
          cache-from: type=gha,scope=commit-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=commit-image-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Check image revision
        env:
          IMAGE: ${{ needs.source.outputs.image }}@${{ steps.image.outputs.digest }}
          PLATFORM: ${{ matrix.dockerPlatform }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          docker pull --platform "$PLATFORM" "$IMAGE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$SOURCE_SHA"

      - name: Verify exact image digest
        uses: ./.github/actions/verify-container
        with:
          image: ${{ needs.source.outputs.image }}@${{ steps.image.outputs.digest }}
          platform: ${{ matrix.dockerPlatform }}
          artifact-name: container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

      - name: Record verified digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p dist/digests
          printf '%s\n' "$IMAGE_DIGEST" > "dist/digests/linux-${IMAGE_ARCH}.txt"

      - name: Upload verified digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: dist/digests/*.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [source, quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Download verified digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: dist/digests
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to fork GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified commit image
        env:
          IMAGE: ${{ needs.source.outputs.image }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          PLATFORM_MATRIX: ${{ needs.source.outputs.matrix }}
        run: |
          set -euo pipefail
          sources=()
          mapfile -t platforms < <(jq -r '.include[].dockerPlatform' <<< "$PLATFORM_MATRIX")
          for platform in "${platforms[@]}"; do
            digest="$(cat "dist/digests/${platform//\//-}.txt")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          test "${#sources[@]}" -gt 0
          tag="$IMAGE:sha-$SOURCE_SHA"
          docker buildx imagetools create --tag "$tag" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$digest" --raw > manifest.json
          for platform in "${platforms[@]}"; do
            jq --exit-status --arg platform "$platform" \
              'any(.manifests[]; (.platform.os + "/" + .platform.architecture) == $platform)' manifest.json
          done
          {
            echo "Verified image: $tag"
            echo "Pinned image: $IMAGE@$digest"
            echo "Source commit: $SOURCE_SHA"
            echo "Platforms: ${platforms[*]}"
          } >> "$GITHUB_STEP_SUMMARY"
